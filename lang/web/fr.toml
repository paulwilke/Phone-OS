config.sim_pin.label                  = "Code PIN de la SIM"
config.sim_pin.help                   = "Code PIN de 4 à 8 chiffres de la carte SIM. Essayé une fois par démarrage. Laisser vide si aucun PIN n'est configuré."
config.web_password.label             = "Mot de passe web"
config.web_password.help              = "Mot de passe de la page web. Au moins 4 caractères. Sans mot de passe, la page web reste verrouillée."

