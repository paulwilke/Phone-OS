# Français — la page des parents (interface web et formulaire de configuration). Les mots de l'appareil sont dans ../fr.toml.

[meta]
code   = "fr"
name   = "French"
native = "Français"
plural = "zero-one-other"

[strings]

# Clés de configuration (config.*)

config.file.settings.label = "Réglages"
config.file.contacts.label = "Contacts"
config.file.secrets.label  = "Accès"

config.child.label                    = "Enfant"
config.child.name.label               = "Nom"
config.child.name.help                = "Nom de l'enfant, utilisé dans les messages SOS et les réponses de position."

config.display.label                  = "Affichage"
config.display.map_url.label          = "Lien de la carte"
config.display.map_url.help           = "Modèle d'URL pour le lien de la carte dans les messages SOS. Utilisez {lat} et {lon} comme variables."

config.modem.label = "Modem"
config.modem.apn.label = "APN"
config.modem.apn.help = "Nom du point d'accès du réseau mobile. Laisser vide : l'appareil le choisit d'après la carte SIM. À remplir seulement si ce choix ne convient pas à votre SIM. Lettres, chiffres, points, traits d'union et tirets bas uniquement."

config.battery.label = "Batterie"
config.battery.capacity_mah.label = "Capacité de la batterie (mAh)"
config.battery.capacity_mah.help = "La taille de la batterie en milliampères-heures. La jauge de charge est livrée avec une taille d'usine qui n'est pas celle de l'appareil ; à chaque démarrage, l'appareil compare les deux et écrit cette valeur dans la jauge si elles diffèrent. Plage : 100-10000."

config.interface.label                = "Interface"
config.interface.language.label       = "Langue"
config.interface.language.help        = "Code de langue de l'interface (par ex. en, de, fr). Avec un code inconnu, la valeur par défaut s'applique et un avertissement apparaît."

config.sms.label                      = "SMS"
config.sms.language.label             = "Langue des SMS"
config.sms.language.help              = "Langue des SMS envoyés par l'appareil (par ex. en, de, fr)."
config.sms.extra_trigger_words.label  = "Mots déclencheurs supplémentaires"
config.sms.extra_trigger_words.help   = "Mots supplémentaires qui déclenchent une demande de position, en plus des mots intégrés de toutes les langues installées. Séparer plusieurs mots par des virgules."

config.features.label                 = "Fonctions"
config.features.free_text.label       = "Texte libre"
config.features.free_text.help        = "Autoriser l'enfant à écrire des messages libres et à choisir n'importe quel destinataire."
config.features.radio.label           = "Radio"
config.features.radio.help            = "Autoriser la radio longue portée (elle ne démarre que sur demande)."
config.features.parent_tools.label    = "Outils des parents"
config.features.parent_tools.help     = "Afficher les pages Wi-Fi et État sur l'appareil."
config.features.message_vibration.label = "Vibreur des messages"
config.features.message_vibration.help  = "Faire vibrer l'appareil à la réception d'un SMS."
config.features.call_vibration.label  = "Vibreur des appels"
config.features.call_vibration.help   = "Faire vibrer l'appareil pour les appels entrants en dehors des heures de classe."
config.features.quiet_call_vibration.label = "Vibreur pendant les heures de classe"
config.features.quiet_call_vibration.help  = "Faire vibrer l'appareil aussi pour les appels entrants pendant les heures de classe (l'appel est quand même refusé)."
config.features.modem_sleep.label     = "Veille du modem"
config.features.modem_sleep.help      = "Autoriser le modem à se mettre en veille quand il ne sert pas, pour économiser la batterie."

config.remote_queries.label           = "Demandes de position"
config.remote_queries.notice.label    = "Affichage de la demande"
config.remote_queries.notice.help     = "Visibilité d'une demande de position sur l'appareil : silent (dans le journal seulement), history (aussi dans l'historique) ou notify (historique et notification)."
config.remote_queries.notice.silent.label = "Silencieux (journal seul)"
config.remote_queries.notice.history.label = "Dans l'historique"
config.remote_queries.notice.notify.label = "Historique et avis"

config.time.label                     = "Heure"
config.time.timezone.label            = "Fuseau horaire"
config.time.timezone.help             = "Fuseau horaire nommé pour les heures de classe et l'horloge (par ex. Europe/Paris). Il l'emporte sur le fuseau du réseau."

config.log.label                      = "Journal"
config.log.level.label                = "Niveau du journal"
config.log.level.help                 = "Ce qui est enregistré : all (tout), events (appels et messages) ou errors (erreurs seulement). Les demandes de position et les SOS sont toujours enregistrés."
config.log.level.all.label = "Tout"
config.log.level.events.label = "Événements (appels et messages)"
config.log.level.errors.label = "Erreurs seulement"

config.wifi.label                     = "Wi-Fi"
