config.wifi.access_point.password.help  = "Mot de passe du point d'accès. Vide : un mot de passe aléatoire à chaque démarrage, affiché uniquement sur l'écran de l'appareil."
config.wifi.network.label             = "Réseaux de la maison"
config.wifi.network.help              = "Réseaux Wi-Fi de la maison auxquels l'appareil peut se connecter, essayés dans l'ordre. 4 au maximum."
config.wifi.network.ssid.label        = "Nom du réseau (SSID)"
config.wifi.network.ssid.help         = "Nom du réseau Wi-Fi de la maison."
config.wifi.network.password.label    = "Mot de passe du réseau"
config.wifi.network.password.help     = "Mot de passe du réseau de la maison. Vide pour un réseau ouvert."

config.radio.label                    = "Radio"
config.radio.name.label               = "Nom radio"
config.radio.name.help                = "Nom de cet appareil dans le réseau radio longue portée."
config.radio.peer.label               = "Correspondant par défaut"
config.radio.peer.help                = "Nom de l'appareil auquel vont les messages radio quand aucun destinataire n'est choisi."

