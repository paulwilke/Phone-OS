# Deutsch — die Seite der Eltern (Weboberflaeche und Konfigurationsformular). Die Woerter des Geraets stehen in ../de.toml.

[meta]
code   = "de"
name   = "German"
native = "Deutsch"
plural = "one-other"

[strings]

# Konfigurationsschluessel (config.*)

config.file.settings.label = "Einstellungen"
config.file.contacts.label = "Kontakte"
config.file.secrets.label  = "Geheimnisse"

config.child.label                    = "Kind"
config.child.name.label               = "Name"
config.child.name.help                = "Name des Kindes, erscheint in SOS-Nachrichten und Positionsantworten."

config.display.label                  = "Anzeige"
config.display.map_url.label          = "Kartenlink"
config.display.map_url.help           = "URL-Vorlage fuer den Kartenlink in SOS-Nachrichten. Platzhalter: {lat} und {lon}."

config.modem.label = "Modem"
config.modem.apn.label = "APN"
config.modem.apn.help = "Zugangspunktname des Mobilfunknetzes, etwa von der Hilfeseite des Anbieters. Das Modem braucht ihn, um sich fuer Anrufe ueber LTE anzumelden. Leer lassen, um das im Modem Gespeicherte zu behalten. Nur Buchstaben, Ziffern, Punkte, Bindestriche und Unterstriche."

config.interface.label                = "Oberflaeche"
config.interface.language.label       = "Sprache"
config.interface.language.help        = "Sprachcode der Oberflaeche (z. B. en, de, fr). Unbekannter Code faellt auf die Voreinstellung zurueck."

config.sms.label                      = "SMS"
config.sms.language.label             = "SMS-Sprache"
config.sms.language.help              = "Sprache fuer SMS-Nachrichten des Geraets (z. B. en, de, fr)."
config.sms.extra_trigger_words.label  = "Weitere Ausloesewörter"
config.sms.extra_trigger_words.help   = "Zusaetzliche Woerter, die eine Ortsabfrage ausloesen, neben den eingebauten Ausloesewörtern aller installierten Sprachen."

config.features.label                 = "Funktionen"
config.features.free_text.label       = "Freitext"
config.features.free_text.help        = "Das Kind darf Freitextnachrichten schreiben und den Empfaenger frei waehlen."
config.features.radio.label           = "Funk"
config.features.radio.help            = "Langstreckenfunk erlauben (wird trotzdem nur auf Anfrage gestartet)."
config.features.parent_tools.label    = "Elternwerkzeuge"
config.features.parent_tools.help     = "Einstellungen und WLAN auf dem Geraet anzeigen."
config.features.message_vibration.label = "Vibration bei Nachrichten"
config.features.message_vibration.help  = "Vibrieren, wenn eine SMS eingeht."
config.features.call_vibration.label  = "Vibration bei Anrufen"
config.features.call_vibration.help   = "Bei eingehenden Anrufen ausserhalb der Schulzeit vibrieren."
config.features.quiet_call_vibration.label = "Vibration in der Schulzeit"
config.features.quiet_call_vibration.help  = "Auch in der Schulzeit bei eingehenden Anrufen vibrieren (der Anruf wird trotzdem abgelehnt)."
config.features.modem_sleep.label     = "Modem-Schlaf"
config.features.modem_sleep.help      = "Das Modem darf im Leerlauf schlafen, um den Akku zu schonen."

config.remote_queries.label           = "Ortsabfragen"
config.remote_queries.notice.label    = "Anzeige der Abfrage"
config.remote_queries.notice.help     = "Wie sichtbar eine Ortsabfrage auf dem Geraet ist: silent (nur Protokoll), history oder history und Hinweis."

config.time.label                     = "Zeit"
config.time.timezone.label            = "Zeitzone"
config.time.timezone.help             = "Benannte Zeitzone fuer Schulzeit und Uhr (z. B. Europe/Berlin). Ueberschreibt die Zeitzone des Netzes."

config.log.label                      = "Protokoll"
config.log.level.label                = "Protokollebene"
config.log.level.help                 = "Wie viel protokolliert wird: all, events (Anrufe und Nachrichten) oder errors. Ortsabfragen und SOS werden immer protokolliert."

config.wifi.label                     = "WLAN"
config.wifi.auto_off_minutes.label    = "Automatisch aus nach (Minuten)"
config.wifi.auto_off_minutes.help     = "Das WLAN schaltet sich so viele Minuten nach der letzten Nutzung der Elternseite ab. Bereich: 1-120."
config.wifi.access_point.label        = "Zugangspunkt"
config.wifi.access_point.ssid.label   = "Name des Zugangspunkts"
config.wifi.access_point.ssid.help    = "Name des eigenen WLAN-Netzes des Geraets."
config.wifi.access_point.password.label = "Passwort des Zugangspunkts"
config.wifi.access_point.password.help  = "Passwort des Zugangspunkts. Leer: bei jedem Start ein zufaelliges, nur auf dem Bildschirm sichtbar."
config.wifi.network.label             = "Heimnetze"
config.wifi.network.help              = "Heimnetze, zu denen das Geraet verbindet, der Reihe nach versucht. Maximal 4."
config.wifi.network.ssid.label        = "Netzname (SSID)"
config.wifi.network.ssid.help         = "Name des Heim-WLAN."
config.wifi.network.password.label    = "Netzpasswort"
config.wifi.network.password.help     = "Passwort des Heimnetzes. Leer fuer ein offenes Netz."

config.radio.label                    = "Funk"
config.radio.name.label               = "Funkname"
config.radio.name.help                = "Name dieses Geraets im Langstreckenfunknetz."
config.radio.peer.label               = "Standardempfaenger"
config.radio.peer.help                = "Name des Geraets, an das Funknachrichten gehen, wenn kein Empfaenger gewaehlt wird."

config.quiet_hours.label              = "Schulzeiten"
config.quiet_hours.help               = "Zeitfenster, in denen das Geraet sperrt. Pro Fenster einen Eintrag anlegen."
config.quiet_hours.days.label         = "Tage"
config.quiet_hours.days.help          = "Wochentage fuer dieses Fenster (z. B. mon-fri, daily)."
config.quiet_hours.from.label         = "Von"
config.quiet_hours.from.help          = "Beginn des Schulzeitfensters (HH:MM, 24-Stunden)."
config.quiet_hours.to.label           = "Bis"
config.quiet_hours.to.help            = "Ende des Schulzeitfensters (HH:MM, 24-Stunden)."

config.tiles.label                    = "Anrufschaltflaechen"
config.tiles.help                     = "Die Anrufschaltflaechen auf dem Startbildschirm in der Reihenfolge ihres Erscheinens. Nur action=call-Eintraege ergeben ein Anrufziel; andere Aktionen werden mit einer Warnung uebergangen."
config.tiles.label_key.label          = "Beschriftung"
config.tiles.label_key.help           = "Beschriftung der Schaltflaeche. Optional."
config.tiles.action.label             = "Aktion"
config.tiles.action.help              = "Was die Schaltflaeche tut. Nur call wird derzeit genutzt; andere Aktionen werden mit einer Warnung uebergangen."
config.tiles.target.label             = "Rufnummer"
config.tiles.target.help              = "Anzurufende Nummer. Pflichtfeld, wenn Aktion call ist."

config.contact.label                  = "Kontakte"
config.contact.help                   = "Personen, die das Geraet anrufen und schreiben duerfen. Pro Person einen Eintrag anlegen."
config.contact.number.label           = "Rufnummer"
config.contact.number.help            = "Rufnummer im E.164-Format (z. B. +491701111111). Pflichtfeld."
config.contact.name.label             = "Name"
config.contact.name.help              = "Name, der auf dem Geraet erscheint."
config.contact.role.label             = "Rolle"
config.contact.role.help              = "parent: darf das Geraet per SMS abfragen und kommt in der Schulzeit durch. family: darf anrufen und schreiben."

config.sim_pin.label                  = "SIM-PIN"
config.sim_pin.help                   = "4-8-stellige PIN der SIM-Karte. Wird einmal beim Start versucht. Leer lassen, wenn keine PIN gesetzt ist."
config.web_password.label             = "Web-Passwort"
config.web_password.help              = "Passwort der Weboberflaeche. Mindestens 4 Zeichen. Ohne Passwort bleibt die Weboberflaeche gesperrt."

