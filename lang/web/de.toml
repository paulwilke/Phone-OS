# Deutsch — die Seite der Eltern (Webseite und Konfigurationsformular). Die Wörter des Geräts stehen in ../de.toml.

[meta]
code   = "de"
name   = "German"
native = "Deutsch"
plural = "one-other"

[strings]

# Konfigurationsschlüssel (config.*)

config.file.settings.label = "Einstellungen"
config.file.contacts.label = "Kontakte"
config.file.secrets.label  = "Zugangsdaten"

config.child.label                    = "Kind"
config.child.name.label               = "Name"
config.child.name.help                = "Name des Kindes, erscheint in SOS-Nachrichten und Positionsantworten."

config.display.label                  = "Anzeige"
config.display.map_url.label          = "Kartenlink"
config.display.map_url.help           = "URL-Vorlage für den Kartenlink in SOS-Nachrichten. Platzhalter: {lat} und {lon}."

config.modem.label = "Modem"
config.modem.apn.label = "APN"
config.modem.apn.help = "Zugangspunktname des Mobilfunknetzes. Leer lassen: Das Gerät wählt ihn anhand der SIM-Karte. Nur ausfüllen, wenn diese Wahl für Ihre SIM nicht stimmt. Nur Buchstaben, Ziffern, Punkte, Bindestriche und Unterstriche."

config.battery.label = "Akku"
config.battery.capacity_mah.label = "Akkukapazität (mAh)"
config.battery.capacity_mah.help = "Die Größe des Akkus in Milliamperestunden. Der Akku-Messchip wird mit einer Werksgröße geliefert, die nicht die des Geräts ist; bei jedem Start vergleicht das Gerät beide und schreibt diesen Wert in den Messchip, wenn sie sich unterscheiden. Bereich: 100-10000."

config.interface.label                = "Oberfläche"
config.interface.language.label       = "Sprache"
config.interface.language.help        = "Sprachcode der Oberfläche (z. B. en, de, fr). Bei einem unbekannten Code gilt die Voreinstellung, und es erscheint eine Warnung."

config.sms.label                      = "SMS"
config.sms.language.label             = "SMS-Sprache"
config.sms.language.help              = "Sprache der SMS, die das Gerät sendet (z. B. en, de, fr)."
config.sms.extra_trigger_words.label  = "Weitere Auslösewörter"
config.sms.extra_trigger_words.help   = "Zusätzliche Wörter, die eine Ortsabfrage auslösen, neben den eingebauten Auslösewörtern aller installierten Sprachen. Mehrere durch Kommas trennen."

config.features.label                 = "Funktionen"
config.features.free_text.label       = "Freitext"
config.features.free_text.help        = "Das Kind darf frei formulierte Nachrichten schreiben und den Empfänger frei wählen. Damit sind auch Kurz- und Premiumnummern (kostenpflichtig) erreichbar."
config.features.radio.label           = "Funk"
config.features.radio.help            = "Den Langstreckenfunk erlauben (er startet trotzdem nur auf Anfrage)."
config.features.parent_tools.label    = "Elternwerkzeuge"
config.features.parent_tools.help     = "Die Seiten WLAN und Status auf dem Gerät anzeigen."
config.features.message_vibration.label = "Vibration bei Nachrichten"
config.features.message_vibration.help  = "Vibrieren, wenn eine SMS eingeht."
config.features.call_vibration.label  = "Vibration bei Anrufen"
config.features.call_vibration.help   = "Bei eingehenden Anrufen außerhalb der Schulzeit vibrieren."
config.features.quiet_call_vibration.label = "Vibration in der Schulzeit"
config.features.quiet_call_vibration.help  = "Auch in der Schulzeit bei eingehenden Anrufen vibrieren (der Anruf wird trotzdem abgelehnt)."
config.features.modem_sleep.label     = "Modem-Schlafmodus"
config.features.modem_sleep.help      = "Das Modem darf im Leerlauf in den Schlafmodus gehen, um den Akku zu schonen."

config.remote_queries.label           = "Ortsabfragen"
config.remote_queries.enabled.label   = "Ortsabfragen beantworten"
config.remote_queries.enabled.help    = "Ob das Gerät die Ortsabfrage eines Elternteils beantwortet. Aus: Jede Abfrage wird abgewiesen, keine Antwort gesendet, die Abweisung protokolliert. Eine Antwort bleibt immer im Verlauf."
config.remote_queries.notice.label    = "Anzeige der Abfrage"
config.remote_queries.notice.help     = "Wie sichtbar eine Ortsabfrage auf dem Gerät ist: silent (nur im Protokoll), history (auch im Verlauf) oder notify (Verlauf und ein Hinweis)."
config.remote_queries.notice.silent.label = "Still (nur Protokoll)"
config.remote_queries.notice.history.label = "Im Verlauf"
config.remote_queries.notice.notify.label = "Verlauf und Hinweis"

config.time.label                     = "Zeit"
config.time.timezone.label            = "Zeitzone"
config.time.timezone.help             = "Benannte Zeitzone für Schulzeit und Uhr (z. B. Europe/Berlin). Sie hat Vorrang vor der Zeitzone des Netzes."

config.log.label                      = "Protokoll"
config.log.level.label                = "Protokollebene"
config.log.level.help                 = "Wie viel protokolliert wird: all (alles), events (Anrufe und Nachrichten) oder errors (nur Fehler). Ortsabfragen und SOS werden immer protokolliert."
config.log.level.all.label = "Alles"
config.log.level.events.label = "Ereignisse (Anrufe und Nachrichten)"
config.log.level.errors.label = "Nur Fehler"

config.wifi.label                     = "WLAN"
config.wifi.auto_off_minutes.label    = "Automatisch aus nach (Minuten)"
config.wifi.auto_off_minutes.help     = "Das WLAN schaltet sich so viele Minuten nach der letzten Nutzung der Elternseite aus. Bereich: 1-120."
config.wifi.access_point.label        = "Zugangspunkt"
config.wifi.access_point.ssid.label   = "Name des Zugangspunkts"
config.wifi.access_point.ssid.help    = "Name des eigenen WLANs des Geräts."
config.wifi.access_point.password.label = "Passwort des Zugangspunkts"
config.wifi.access_point.password.help  = "Passwort des Zugangspunkts. Leer: bei jedem Start ein zufälliges Passwort, das nur auf dem Bildschirm des Geräts steht."
config.wifi.network.label             = "Heimnetze"
config.wifi.network.help              = "Heimnetze, mit denen sich das Gerät verbinden darf; sie werden der Reihe nach versucht. Höchstens 4."
config.wifi.network.ssid.label        = "Netzname (SSID)"
config.wifi.network.ssid.help         = "Name des Heim-WLAN."
config.wifi.network.password.label    = "Netzpasswort"
config.wifi.network.password.help     = "Passwort des Heimnetzes. Leer bei einem offenen Netz."

config.radio.label                    = "Funk"
config.radio.name.label               = "Funkname"
config.radio.name.help                = "Name dieses Geräts im Langstreckenfunknetz."
config.radio.peer.label               = "Standardempfänger"
config.radio.peer.help                = "Name des Geräts, an das Funknachrichten gehen, wenn kein Empfänger gewählt wird."

# Home screen: which tiles of the second page the child sees
config.home.label                     = "Startbildschirm: zweite Seite"
config.home.network.label             = "Kachel \"Netz\""
config.home.gps.label                 = "Kachel \"GPS\""
config.home.clock.label               = "Kachel \"Uhr\""
config.home.settings.label            = "Kachel \"Option\""
config.home.wifi.label                = "Kachel \"WLAN\""
config.home.motion.label              = "Kachel \"Lage\""
config.home.tests.label               = "Kachel \"Tests\""
config.home.status.label              = "Kachel \"Status\""
config.home.wifi.help                 = "Nur sichtbar, wenn die Elternwerkzeuge an sind. Ohne sie ist die Elternseite weiter über das USB-Kabel erreichbar."
config.home.motion.help               = "Nur sichtbar auf einem Gerät mit Bewegungssensor."
config.home.status.help               = "Nur sichtbar, wenn die Elternwerkzeuge an sind."

config.quiet_hours.label              = "Schulzeiten"
config.quiet_hours.help               = "Zeitfenster, in denen das Gerät gesperrt ist. Pro Fenster einen Eintrag anlegen."
config.quiet_hours.days.label         = "Tage"
config.quiet_hours.days.help          = "Wochentage, für die dieses Fenster gilt (z. B. mon-fri, daily)."
config.quiet_hours.from.label         = "Von"
config.quiet_hours.from.help          = "Beginn des Schulzeitfensters (HH:MM, 24-Stunden-Zeit)."
config.quiet_hours.to.label           = "Bis"
config.quiet_hours.to.help            = "Ende des Schulzeitfensters (HH:MM, 24-Stunden-Zeit)."
config.quiet_hours.enabled.label        = "aktiv"
config.quiet_hours.enabled.help         = "Schaltet dieses Fenster ein. Ein Fenster ohne Haken bleibt gespeichert, sperrt aber nie."

config.tiles.label                    = "Anrufschaltflächen"
config.tiles.help                     = "Die Anrufschaltflächen auf dem Startbildschirm, in der Reihenfolge, in der sie erscheinen. Nur Einträge mit action=call ergeben ein Anrufziel; andere Aktionen werden übergangen, und es erscheint eine Warnung."
config.tiles.label_key.label          = "Beschriftung"
config.tiles.label_key.help           = "Beschriftung der Schaltfläche. Optional."
config.tiles.action.label             = "Aktion"
config.tiles.action.help              = "Was die Schaltfläche tut. Derzeit wird nur call genutzt; andere Aktionen werden übergangen, und es erscheint eine Warnung."
config.tiles.action.call.label = "Anrufen"
config.tiles.action.compose.label = "Nachricht schreiben"
config.tiles.action.messages.label = "Nachrichten"
config.tiles.action.light.label = "Licht"
config.tiles.action.status.label = "Status"
config.tiles.action.sos.label = "SOS"
config.tiles.target.label             = "Rufnummer"
config.tiles.target.help              = "Anzurufende Nummer. Pflichtfeld, wenn Aktion call ist."

config.contact.label                  = "Kontakte"
config.contact.help                   = "Personen, die das Gerät anrufen und ihm schreiben dürfen. Pro Person einen Eintrag anlegen."
config.contact.number.label           = "Rufnummer"
config.contact.number.help            = "Rufnummer im E.164-Format (z. B. +491701111111). Pflichtfeld."
config.contact.name.label             = "Name"
config.contact.name.help              = "Name, der auf dem Gerät erscheint."
config.contact.role.label             = "Rolle"
config.contact.role.help              = "parent: darf das Gerät per SMS abfragen; in der Schulzeit vibriert das Gerät nur bei einer SMS von einem Elternteil, jeder Anruf wird abgelehnt. family: darf anrufen und schreiben."
config.contact.sos.label              = "SOS"
config.contact.sos.help               = "Das SOS geht an jeden hier angehakten Kontakt. Ohne Haken geht es an den ersten Anrufknopf."
config.contact.role.parent.label = "Elternteil"
config.contact.role.family.label = "Familie"

config.sim_pin.label                  = "SIM-PIN"
config.sim_pin.help                   = "4-8-stellige PIN der SIM-Karte. Wird pro Start einmal versucht. Leer lassen, wenn keine PIN gesetzt ist."
config.web_password.label             = "Web-Passwort"
config.web_password.help              = "Passwort der Webseite. Mindestens 4 Zeichen. Ohne Passwort bleibt die Webseite gesperrt."

