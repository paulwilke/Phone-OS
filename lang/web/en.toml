# English — the page of the parents (web interface and configuration form). The device's own words are in ../en.toml.
# Checked like the device catalog: the same keys in every language, the same {placeholders}.

[meta]
code = "en"
name = "English"
native = "English"
plural = "one-other"

[strings]

# Configuration key labels and help texts (config.*)
# Used by the web interface to label and describe each configuration field.

config.file.settings.label = "Settings"
config.file.contacts.label = "Contacts"
config.file.secrets.label = "Secrets"

config.child.label = "Child"
config.child.name.label = "Name"
config.child.name.help = "The child's name, used in SOS messages and position replies."

config.display.label = "Display"
config.display.map_url.label = "Map link"
config.display.map_url.help = "URL template for the map link in SOS messages. Use {lat} and {lon} as placeholders."

config.interface.label = "Interface"
config.interface.language.label = "Language"
config.interface.language.help = "Language code of the interface (e.g. en, de, fr). Unknown code falls back to the default with a warning."

config.sms.label = "SMS"
config.sms.language.label = "SMS language"
config.sms.language.help = "Language for SMS messages the device sends (e.g. en, de, fr)."
config.sms.extra_trigger_words.label = "Extra trigger words"
config.sms.extra_trigger_words.help = "Additional words that trigger a remote location query, besides the built-in trigger words of all installed languages."

config.features.label = "Features"
config.features.free_text.label = "Free text"
config.features.free_text.help = "Allow the child to write free-text messages and choose any recipient."
config.features.radio.label = "Radio"
config.features.radio.help = "Allow the long-range radio (it still starts only on request)."
config.features.parent_tools.label = "Parent tools"
config.features.parent_tools.help = "Show the settings and Wi-Fi pages on the device."
config.features.message_vibration.label = "Message vibration"
config.features.message_vibration.help = "Vibrate when an SMS arrives."
config.features.call_vibration.label = "Call vibration"
config.features.call_vibration.help = "Vibrate for incoming calls outside school time."
config.features.quiet_call_vibration.label = "Vibration in school time"
config.features.quiet_call_vibration.help = "Also vibrate for incoming calls during school time (the call is still rejected)."
config.features.modem_sleep.label = "Modem sleep"
config.features.modem_sleep.help = "Allow the modem to sleep when idle to save battery."

config.remote_queries.label = "Remote queries"
config.remote_queries.notice.label = "Query notice"
config.remote_queries.notice.help = "How visible a remote location query is on the device: silent (log only), history, or history and a notice."

config.time.label = "Time"
config.time.timezone.label = "Time zone"
config.time.timezone.help = "Named time zone for school time and the clock (e.g. Europe/Berlin). Overrides the network's zone."

config.log.label = "Log"
config.log.level.label = "Log level"
config.log.level.help = "How much of the log is written: all, events (calls and messages), or errors only. Remote queries and SOS are always logged."

config.wifi.label = "Wi-Fi"
config.wifi.auto_off_minutes.label = "Auto-off after (minutes)"
config.wifi.auto_off_minutes.help = "Wi-Fi switches itself off this many minutes after the parents' page was last used. Range: 1-120."
config.wifi.access_point.label = "Access point"
config.wifi.access_point.ssid.label = "Access point name"
config.wifi.access_point.ssid.help = "Name of the device's own Wi-Fi network."
config.wifi.access_point.password.label = "Access point password"
config.wifi.access_point.password.help = "Password for the access point. Empty: a random one at every start, shown on the device screen only."
config.wifi.network.label = "Home networks"
config.wifi.network.help = "Home networks the device may connect to, tried in order. At most 4."
config.wifi.network.ssid.label = "Network name (SSID)"
config.wifi.network.ssid.help = "Name of the home Wi-Fi network."
config.wifi.network.password.label = "Network password"
config.wifi.network.password.help = "Password of the home network. Empty for an open network."

config.radio.label = "Radio"
config.radio.name.label = "Radio name"
config.radio.name.help = "Name of this device in the long-range radio network."
config.radio.peer.label = "Default peer"
config.radio.peer.help = "Name of the device to send radio messages to when no recipient is chosen."

config.quiet_hours.label = "School times"
config.quiet_hours.help = "Time windows during which the device locks. Add one entry per window."
config.quiet_hours.days.label = "Days"
config.quiet_hours.days.help = "Weekdays this window applies to (e.g. mon-fri, daily)."
config.quiet_hours.from.label = "From"
config.quiet_hours.from.help = "Start of the school-time window (HH:MM, 24-hour)."
config.quiet_hours.to.label = "To"
config.quiet_hours.to.help = "End of the school-time window (HH:MM, 24-hour)."

config.tiles.label = "Call buttons"
config.tiles.help = "The call buttons on the home screen, in the order they appear. Only action=call buttons add a call target; other actions are ignored with a warning."
config.tiles.label_key.label = "Button label"
config.tiles.label_key.help = "Label shown on the button. Optional."
config.tiles.action.label = "Action"
config.tiles.action.help = "What the button does. Only call is currently used; other actions are ignored with a warning."
config.tiles.target.label = "Phone number"
config.tiles.target.help = "Phone number to call. Required when action is call."

config.contact.label = "Contacts"
config.contact.help = "People who may call and write to the device. Add one entry per person."
config.contact.number.label = "Phone number"
config.contact.number.help = "Phone number in E.164 format (e.g. +491701111111). Required."
config.contact.name.label = "Name"
config.contact.name.help = "Name shown on the device."
config.contact.role.label = "Role"
config.contact.role.help = "parent: may query the device by SMS and gets through in school time. family: may call and write."

config.sim_pin.label = "SIM PIN"
config.sim_pin.help = "4-8 digit PIN for the SIM card. Tried once per start. Leave empty if the PIN is disabled."
config.web_password.label = "Web password"
config.web_password.help = "Password for the web interface. At least 4 characters. Without a password the web interface stays locked."

