# The child's device with school time always on: every value invented.
[child]
name = "Alex"
[interface]
language = "en"
[sms]
language = "en"
[time]
timezone = "Europe/Berlin"
[features]
free_text = false
radio = true
[wifi]
auto_off_minutes = 10
[radio]
name = "alex-device"
peer = "NodeOne"
[[tiles]]
label = "Parent One"
action = "call"
target = "+491701111111"
[[tiles]]
label = "Parent Two"
action = "call"
target = "+491702222222"
# A window is not active at its end minute and may not start and end at the same minute, so
# "always" is two windows that overlap at midnight.
[[quiet_hours]]
days = "daily"
from = "00:00"
to = "23:59"

[[quiet_hours]]
days = "daily"
from = "23:00"
to = "01:00"
