<html lang="en" data-root="">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="site.meta.title"></title>
<meta name="description" data-i18n-content="site.meta.description">
<meta property="og:title" data-i18n-content="site.meta.title">
<meta property="og:description" data-i18n-content="site.meta.og-description">
<meta name="site-alternates">
<style>
  :root {
    color-scheme: light dark;
    --bg: #f4f2ec;
    --bg-2: #ebe8df;
    --fg: #1b1a17;
    --muted: #5e5a52;
    --line: #d6d2c6;
    --accent: #1b1a17;
    --accent-fg: #f4f2ec;
    --paper: #e9e8e0;
    --bezel: #22211e;
    --bezel-2: #2f2e2a;
    --key: #3a3934;
    --key-fg: #e9e8e0;
    --card: #fbfaf6;
    --shadow: 0 30px 60px -30px rgba(0, 0, 0, 0.45);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161614;
      --bg-2: #1e1e1b;
      --fg: #ebe8df;
      --muted: #a39f94;
      --line: #33322d;
      --accent: #ebe8df;
      --accent-fg: #161614;
      --paper: #e9e8e0;
      --bezel: #0c0c0b;
      --bezel-2: #1a1a18;
      --key: #2a2a26;
      --key-fg: #e9e8e0;
      --card: #1e1e1b;
      --shadow: 0 30px 60px -30px rgba(0, 0, 0, 0.9);
    }
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  a { color: inherit; }
  h1, h2, h3 { line-height: 1.15; letter-spacing: -0.01em; margin: 0; }
  h1 { font-size: clamp(2.1rem, 5vw, 3.4rem); font-weight: 700; }
  h2 { font-size: clamp(1.5rem, 3vw, 2.1rem); margin-bottom: 0.6rem; }
  h3 { font-size: 1.1rem; margin-bottom: 0.3rem; }
  p { margin: 0.5rem 0; }
  .wrap { max-width: 72rem; margin: 0 auto; padding: 0 16px; }
  .muted { color: var(--muted); }
  code { font: 0.92em ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--bg-2); padding: 0.05em 0.35em; border-radius: 4px; }

  /* Top bar */
  nav.top { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  nav.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 1rem; min-height: 3.4rem; }
  nav.top .brand { font-weight: 700; text-decoration: none; letter-spacing: 0.01em; }
  nav.top ul { list-style: none; margin: 0; padding: 0; display: flex; gap: 1.2rem; flex-wrap: wrap; justify-content: flex-end; }
  nav.top a:not(.brand) { text-decoration: none; color: var(--muted); font-size: 0.95rem; }
  nav.top a:hover { color: var(--fg); }
  @media (max-width: 40rem) { nav.top ul li.hide-s { display: none; } }

  /* Hero */
  .hero { padding: clamp(2rem, 6vw, 5rem) 0 clamp(2rem, 5vw, 4rem); }
  .hero .wrap { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: clamp(1.5rem, 5vw, 5rem); align-items: center; }
  @media (max-width: 56rem) { .hero .wrap { grid-template-columns: 1fr; } }
  .eyebrow { text-transform: uppercase; letter-spacing: 0.12em; font-size: 0.78rem; color: var(--muted); margin-bottom: 1rem; }
  .lead { font-size: 1.15rem; margin: 1.2rem 0 1.6rem; max-width: 36rem; }
  .actions { display: flex; flex-wrap: wrap; gap: 0.7rem; align-items: center; }
  .btn { display: inline-block; padding: 0.7rem 1.1rem; border-radius: 8px; text-decoration: none; border: 1px solid var(--line); font-weight: 600; }
  .btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  .btn:hover { filter: brightness(1.08); }
  .langs { font-size: 0.92rem; color: var(--muted); }
  .langs a { margin-right: 0.6rem; }

  /* The device */
  .device-col { display: flex; flex-direction: column; align-items: center; gap: 0.9rem; }
  .device { background: linear-gradient(160deg, var(--bezel-2), var(--bezel)); border-radius: 22px; padding: 22px 18px 18px; box-shadow: var(--shadow); width: min(100%, 396px); }
  .screen { position: relative; background: var(--paper); border-radius: 4px; overflow: hidden; aspect-ratio: 3 / 4; }
  .screen img { display: block; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; }
  .screen .flash { position: absolute; inset: 0; background: #111; opacity: 0; pointer-events: none; transition: opacity 120ms; }
  /* The places a finger can tap, laid over the picture where the screen says they are. */
  .screen .tap { position: absolute; margin: 0; padding: 0; border: 0; background: transparent; cursor: pointer; border-radius: 3px; }
  .screen .tap:hover, .screen .tap:focus-visible { outline: 2px solid rgba(27, 26, 23, 0.55); outline-offset: -2px; }
  .screen.refresh .flash { opacity: 1; }
  .softkeys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 14px; }
  .pad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 12px; }
  .device button { font: inherit; color: var(--key-fg); background: var(--key); border: 1px solid rgba(255, 255, 255, 0.08); border-bottom-width: 3px; border-radius: 9px; padding: 0.55rem 0.3rem; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 2.9rem; line-height: 1.1; }
  .device button .sym { font-size: 1.15rem; }
  .device button .lbl { font-size: 0.66rem; letter-spacing: 0.06em; text-transform: uppercase; opacity: 0.75; }
  .device button:hover:not(:disabled) { filter: brightness(1.2); }
  .device button:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 1px; }
  .device button:disabled { opacity: 0.3; cursor: default; }
  .device button:focus-visible { outline: 3px solid #e9e8e0; outline-offset: 1px; }
  .device-meta { width: min(100%, 396px); display: flex; justify-content: space-between; align-items: center; gap: 0.8rem; font-size: 0.9rem; color: var(--muted); flex-wrap: wrap; }
  .device-meta select, .device-meta button { font: inherit; font-size: 0.9rem; background: var(--card); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 0.3rem 0.6rem; cursor: pointer; }
  .device-note { width: min(100%, 396px); font-size: 0.9rem; color: var(--muted); text-align: center; }
  .device-note a { color: var(--fg); }

  /* Sections */
  section { padding: clamp(2.5rem, 6vw, 5rem) 0; border-top: 1px solid var(--line); }
  section.alt { background: var(--bg-2); }
  .intro { max-width: 44rem; margin-bottom: 2rem; }
  /* Three cards a row on a wide screen, two at medium width, one on a phone; the picture on top, large enough to read. */
  .cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1.2rem; }
  @media (max-width: 60rem) { .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 36rem) { .cards { grid-template-columns: 1fr; } }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 1.2rem; display: flex; flex-direction: column; gap: 0.9rem; }
  .card img { display: block; align-self: center; width: 192px; max-width: 100%; height: auto; aspect-ratio: 3 / 4; image-rendering: pixelated; image-rendering: crisp-edges; border: 1px solid var(--line); border-radius: 3px; background: var(--paper); }
  .card p { margin: 0; font-size: 0.97rem; color: var(--muted); }
  .words { display: grid; grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr)); gap: 1.2rem; margin-top: 1.5rem; }
  .word { border-left: 3px solid var(--fg); padding-left: 1rem; }
  .word strong { display: block; font-size: 1.15rem; margin-bottom: 0.2rem; }
  .word p { margin: 0; color: var(--muted); font-size: 0.97rem; }
  .steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr)); gap: 1.2rem; margin-top: 1.5rem; }
  .step { border-left: 3px solid var(--fg); padding-left: 1rem; display: flex; flex-direction: column; gap: 0.5rem; }
  .step strong { display: block; font-size: 1.15rem; }
  .step p { margin: 0; color: var(--muted); font-size: 0.97rem; }
  .step code.cmd { display: block; font-size: 0.88rem; padding: 0.45rem 0.6rem; background: var(--card); border: 1px solid var(--line); border-radius: 6px; overflow-x: auto; white-space: nowrap; }
  .note { margin-top: 1.5rem; max-width: 44rem; }
  .stats { display: flex; gap: 2.5rem; flex-wrap: wrap; margin-top: 2rem; }
  .stat b { display: block; font-size: 1.9rem; font-weight: 700; letter-spacing: -0.02em; }
  .stat span { color: var(--muted); font-size: 0.92rem; }
  .layers { width: 100%; border-collapse: collapse; margin-top: 1rem; font-size: 0.97rem; }
  .layers th, .layers td { text-align: left; padding: 0.6rem 0.8rem 0.6rem 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  .layers th { color: var(--muted); font-weight: 600; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.06em; }
  .links { display: grid; grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr)); gap: 0.8rem 1.5rem; margin-top: 1rem; }
  .links a { display: block; text-decoration: none; padding: 0.8rem 0; border-bottom: 1px solid var(--line); }
  .links a strong { display: block; }
  .links a span { color: var(--muted); font-size: 0.92rem; }
  .links a:hover strong { text-decoration: underline; }
  footer { padding: 2.5rem 0 3rem; border-top: 1px solid var(--line); color: var(--muted); font-size: 0.92rem; }
  footer p { margin: 0.3rem 0; }
</style>
</head>
<body>

  const KEYBOARD = { ArrowUp: "up", ArrowDown: "down", Enter: "select", Backspace: "back", Escape: "back", h: "home", i: "inbox", w: "compose" };
  // Written out key by key, so that scripts/check_i18n.py --usage sees every key the page asks for.
  const SCREEN_NAMES = { home: "site.screen.home", lock: "site.screen.lock", clock: "site.screen.clock", phone: "site.screen.phone",
    call: "site.screen.call", messages: "site.screen.messages", compose: "site.screen.compose", recipient: "site.screen.recipient",
    sos: "site.screen.sos", settings: "site.screen.settings", net: "site.screen.net", language: "site.screen.language",
    gnss: "site.screen.gnss", radio: "site.screen.radio", motion: "site.screen.motion", selftest: "site.screen.selftest",
    power: "site.screen.power" };
  // The user's guide exists in every language of the page; the other documents are English only.
  const GUIDES = { en: "https://github.com/paulwilke/Phone-OS/blob/main/docs/user-guide.md",
    de: "https://github.com/paulwilke/Phone-OS/blob/main/docs/de/benutzerhandbuch.md",
    fr: "https://github.com/paulwilke/Phone-OS/blob/main/docs/fr/guide-utilisateur.md" };
  const DEFAULT = "en";

  // Each language has its own pages, prerendered with its words (scripts/make_site.py): the language is the page's
  // folder (/, /de/, /fr/), set in <html lang>, and the folder's depth in data-root ("" at the root, "../" below).
  // Every path the script builds starts with that root.
  // What is used is the code of a catalog the page carries and one of two fixed roots, never a string read off the
  // document or the address as it is (a path built from such a string is what a scanner flags, rightly).
  const known = (code) => data.languages.find((l) => l.code === code);
  const lang = (known(document.documentElement.lang) || { code: DEFAULT }).code;
  const ROOT = document.documentElement.getAttribute("data-root") === "../" ? "../" : "";
  const folder = (code) => (code === DEFAULT ? "" : encodeURIComponent(code) + "/");
  // Links shared before the pages were split name the language in the address: ?lang=de on the root page goes to /de/.
  // A code the page does not have is ignored, and so is the address of a language's own page.
  const asked = known(new URLSearchParams(location.search).get("lang"));
  if (!ROOT && asked && asked.code !== DEFAULT) {
    location.replace("./" + folder(asked.code) + location.hash);
    return;
  }

  let graph = null;
  let node = 0;
  const buttons = {};

  // A word of the page's own language, for what the script builds itself (the keys, the status line, the screens).
  function word(key, values) {
    let text = (data.words[lang] || {})[key] || key;
    for (const name of Object.keys(values || {})) text = text.replace("{" + name + "}", values[name]);
    return text;
  }
  const screenName = (screen) => (SCREEN_NAMES[screen] ? word(SCREEN_NAMES[screen]) : screen);
  const outgoing = (key) => graph.edges.find((e) => e.from === node && e.key === key);
  // The parts of a path are encoded: the language comes from the page, the name from an attribute.
  const picture = (name) => ROOT + "demo/" + encodeURIComponent(lang) + "/" + encodeURIComponent(name) + ".png";
  // "2500+" is shown as 2,500+ in English, 2.500+ in German: the same number in every language.
  function number(value) {
    const m = /^(\d+)(.*)$/.exec(value);
    return m ? Number(m[1]).toLocaleString(lang) + m[2] : value;
  }

  function makeKey(parent, [key, sym, label]) {
    const button = document.createElement("button");
    button.type = "button";
    button.setAttribute("aria-label", word(label));
    const symbol = document.createElement("span");
    symbol.className = "sym";
    symbol.textContent = sym;
    const name = document.createElement("span");
    name.className = "lbl";
    name.textContent = word(label);
    button.appendChild(symbol);
    button.appendChild(name);
    button.addEventListener("click", () => press(key));
    parent.appendChild(button);
    buttons[key] = button;
  }

  // What depends on the language but is not a word of the markup, which is prerendered: the links to the guide, the
  // links to the other languages' guides (not to the one of this page), the full demo, the numbers and the pictures.
  function wire() {
    for (const el of document.querySelectorAll("[data-guide]")) el.setAttribute("href", GUIDES[el.getAttribute("data-guide") || lang]);
    for (const el of document.querySelectorAll("[data-native]")) el.hidden = el.getAttribute("data-native") === lang;
    // The full demo opens in the language of the page; English is its default too.
    for (const el of document.querySelectorAll("[data-demo]")) el.setAttribute("href", ROOT + "demo/index.html" + (lang === DEFAULT ? "" : "?lang=" + encodeURIComponent(lang)));
    for (const el of document.querySelectorAll("[data-number]")) el.textContent = number(el.getAttribute("data-number"));
    for (const el of document.querySelectorAll("[data-picture]")) el.setAttribute("src", picture(el.getAttribute("data-picture")));
  }

  function press(key) {
    if (!graph) return;
    const edge = outgoing(key);
    if (!edge) return;
    node = edge.to;
    show(true);
  }

  function show(moved) {
    const current = graph.nodes[node];
    const img = $("picture");
    const screen = $("screen");
    // A partial refresh of e-ink shows the old picture a moment longer; a flash stands in for the full refresh.
    if (moved) { screen.classList.add("refresh"); setTimeout(() => screen.classList.remove("refresh"), 90); }
    const values = { screen: screenName(current.screen), n: node + 1, total: graph.nodes.length };
    img.setAttribute("src", picture("n" + node));
    img.setAttribute("alt", word("site.device.picture", values));
    $("status").textContent = word("site.device.status", values);
    for (const key of Object.keys(buttons)) buttons[key].disabled = !outgoing(key);
    // The touch targets of this picture, in percent of the panel's 240 x 320, so they scale with it.
    const taps = $("taps");
    taps.textContent = "";
    for (const e of graph.edges) {
      if (e.from !== node || !e.tap) continue;
      const b = document.createElement("button");
      b.type = "button";
      b.className = "tap";
      b.setAttribute("aria-label", word("site.device.tap", { screen: screenName(graph.nodes[e.to].screen) }));
      b.style.left = (e.tap.x / 240 * 100) + "%";
      b.style.top = (e.tap.y / 320 * 100) + "%";
      b.style.width = (e.tap.w / 240 * 100) + "%";
      b.style.height = (e.tap.h / 320 * 100) + "%";
      b.addEventListener("click", () => { node = e.to; show(true); });
      taps.appendChild(b);
    }
    // Preload the neighbours so that a key press shows at once.
    for (const e of graph.edges) if (e.from === node) new Image().src = picture("n" + e.to);
  }

  function firstOf(screen) {
    const n = graph.nodes.find((x) => x.screen === screen);
    return n ? n.id : graph.start;
  }

  // The selector goes to the page of the chosen language, the same place in the page (its hash kept); the address
  // of the page is the language's, so nothing is rewritten in place.
  function go(code) {
    const target = (known(code) || { code: DEFAULT }).code;
    if (target === lang) return;
    location.href = (ROOT || "./") + folder(target) + location.hash;
  }

  for (const k of SOFT) makeKey($("softkeys"), k);
  for (const k of PAD) makeKey($("pad"), k);
  for (const l of data.languages) {
    const option = document.createElement("option");
    option.value = l.code;
    option.textContent = l.native;
    $("language").appendChild(option);
  }
  $("language").value = lang;
  $("language").addEventListener("change", () => go($("language").value));
  $("start").addEventListener("click", () => { if (graph) { node = graph.start; show(true); } });
  $("device").addEventListener("keydown", (ev) => {
    const key = KEYBOARD[ev.key];
    if (!key) return;
    ev.preventDefault();
    press(key);
  });
  wire();

  fetch(ROOT + "demo/graph.json").then((r) => r.json()).then((g) => {
    graph = g;
    node = g.start;
    $("stat-pictures").setAttribute("data-number", String(g.nodes.length * data.languages.length));
    $("pic-compose").setAttribute("data-picture", "n" + firstOf("compose"));
    $("pic-sos").setAttribute("data-picture", "n" + firstOf("sos"));
    wire();
    show(false);
  }).catch(() => {
    $("status").textContent = word("site.device.missing");
  });

  fetch(ROOT + "version.txt").then((r) => r.ok ? r.text() : "").then((v) => {
    if (v.trim()) $("stat-version").textContent = v.trim();
  }).catch(() => {});
})();
</script>
</body>
</html>
