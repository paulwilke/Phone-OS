# config/schema.toml
#
# The single source of truth for every configuration key.
# Run scripts/gen_config.py to regenerate the derived files.
# CI runs scripts/gen_config.py --check and fails when a generated file is out of date.
#
# Each [[file]] entry names one config file on the card.
# Each [[section]] entry names a section inside a file; list=true means [[array of tables]].
# Each [[key]] entry describes one key; its position in the file and section is given by
# `file` and `section`.  Section and file are paths using "." as separator for nested sections
# (e.g. "wifi.access_point").
#
# Key types:
#   string        — UTF-8 string; max_val = maximum byte length (0 = no limit)
#   integer       — integer; min_val/max_val = inclusive range
#   bool          — true or false
#   enum          — string from the pipe-separated list in `enums`
#   string_list   — TOML array of strings
#   weekday_set   — "mon-fri", "mon,wed,fri", "daily", etc.
#   time_of_day   — "HH:MM" (24-hour)
#   phone_number  — E.164 phone number
#   catalog_code  — two-letter (or longer) language code of an installed catalog
#
# Optional on a [[section]] with list = true: `default_entry = { key = value, ... }` is the one entry the
# loader, the generated example file and the page's form use when the file has no entry of that list.
# Optional on a bool [[key]]: `widget = "checkbox"` makes the page draw a checkbox, not a yes/no list.
#
# `group`:  on every key of a file that has [[group]] entries (settings.toml), and only there: the tab of
#           the parents' page that shows the key. All keys of one section share a group, because a
#           section is one table of the file and one box of the form.
# `apply`:  restart = takes effect on next start; immediate = takes effect without restart
# `secret`: value must never appear in logs
# `field`:  Profile field that this key fills; empty string if the key is returned separately
#           (sim_pin, web_password) or fills a sub-struct (table-list keys use the parent
#           section's `field`)

# ---------------------------------------------------------------------------
# Files
# ---------------------------------------------------------------------------

[[file]]
id      = "settings"
path    = "/config/settings.toml"
example = "config/examples/settings.toml"
label   = "config.file.settings.label"

[[file]]
id      = "contacts"
path    = "/config/contacts.toml"
example = "config/examples/contacts.toml"
label   = "config.file.contacts.label"

[[file]]
id      = "secrets"
path    = "/config/secrets.toml"
example = "config/examples/secrets.toml"
label   = "config.file.secrets.label"
secret  = true

# ---------------------------------------------------------------------------
# Groups — the tabs settings.toml is shown on, in the order of the tab bar.
# On one page the settings needed too much scrolling, and most parents never touch half of them.
# `label` names the tab (a web.* catalog key); `note` is an optional line at the top of the tab.
# Every tab saves into the one settings.toml.
# ---------------------------------------------------------------------------

[[group]]
id      = "basics"
file    = "settings"
label   = "web.tab.basics"

[[group]]
id      = "school_time"
file    = "settings"
label   = "web.tab.school-time"

[[group]]
id      = "advanced"
file    = "settings"
label   = "web.tab.advanced"
note    = "web.settings.advanced-note"

