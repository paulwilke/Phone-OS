; Phone OS — host tests of the pure C++ code.
;   pio test -e native
; Device and simulator environments are added together with the code that needs them.
; -I sim: the simulated panel and the PNG writer are header-only and tested with the rest.

[platformio]
default_envs = native

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_flags =
  -std=c++17
  -Wall -Wextra -Werror
  -I src
  -I testing
  -I sim
test_ignore =
  test_check_i18n
  test_schema_gen
  test_gen_apn
  test_web_page
  test_demo_page
  test_check_layers
  test_check_docs
  test_device_tools
  test_translating
  test_privacy_check
  test_make_demo
  test_make_site
  test_site_page

[env:native-asan]
platform = native
test_framework = unity
test_build_src = yes
build_flags =
  -std=c++17
  -Wall -Wextra -Werror
  -I src
  -I testing
  -I sim
  -fsanitize=address,undefined
  -fno-omit-frame-pointer
test_ignore =
  test_check_i18n
  test_schema_gen
  test_gen_apn
  test_web_page
  test_demo_page
  test_check_layers
  test_check_docs
  test_device_tools
  test_translating
  test_privacy_check
  test_make_demo
  test_make_site
  test_site_page

; The simulator: the application on the fakes, a console, no window. Needs nothing but a compiler.
;   pio run -e sim && .pio/build/sim/program --script sim/scripts/smoke.txt
[env:sim]
platform = native
build_flags =
  -std=c++17
  -Wall -Wextra -Werror
  -I src
  -I testing
  -I sim
  -pthread
  -O2
build_src_filter = +<*> +<../sim/main.cpp>

; The same with a window (SDL2: brew install sdl2).
[env:sim-sdl]
extends = env:sim
build_flags =
  ${env:sim.build_flags}
  -DPHONE_OS_SIM_SDL=1
  !sdl2-config --cflags --libs

; The firmware for the T-Deck Pro MAX (docs/hardware/device.md). CI builds it; flashing is the owner's decision.
;   pio run -e device
; Platform code lives in device/, the testable logic in src/. -I src: device/ includes the layers of src/.
[env:device]
platform = platformio/espressif32@6.11.0
framework = arduino
; PlatformIO's own ESP32-S3 board, set to what the T-Deck Pro MAX has: 16 MB QIO flash at 80 MHz and
; 8 MB QSPI PSRAM (BOARD_HAS_PSRAM below), USB serial on the processor's own port.
board = esp32-s3-devkitc-1
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.arduino.memory_type = qio_qspi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_upload.speed = 921600
; The parents' page is data of the firmware (device/FlashAssets.h); web/index.html is generated by
; scripts/gen_web.py and CI checks that it is current.
board_build.embed_txtfiles = web/index.html
monitor_speed = 115200
build_flags =
  -std=gnu++17
  -Wall -Wextra
  -I src
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D BOARD_HAS_PSRAM=1
; MeshCore (D-59): the EU narrow setting of MeshCore's own platformio.ini (869.618 MHz, 62.5 kHz, SF 8, CR 4/5).
; The chip's values are those the T-Deck Pro MAX needs (Meck's variant for this board, same pins as board/PinMap.h):
; DIO2 switches the antenna, the TCXO is fed 2.4 V through DIO3, current limit 140 mA, boosted receive gain.
; No P_LORA_* pin is defined: the adapter hands MeshCore the one shared SPI bus and the pins of PinMap.h.
  -D LORA_FREQ=869.618
  -D LORA_BW=62.5
  -D LORA_SF=8
  -D LORA_CR=5
  -D LORA_TX_POWER=22
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D SX126X_DIO3_TCXO_VOLTAGE=2.4f
  -D RADIOLIB_STATIC_ONLY=1
  -D RADIOLIB_GODMODE=1
  -D RADIOLIB_EXCLUDE_CC1101=1
  -D RADIOLIB_EXCLUDE_RF69=1
  -D RADIOLIB_EXCLUDE_SX1231=1
  -D RADIOLIB_EXCLUDE_SI443X=1
  -D RADIOLIB_EXCLUDE_RFM2X=1
  -D RADIOLIB_EXCLUDE_SX128X=1
  -D RADIOLIB_EXCLUDE_AFSK=1
  -D RADIOLIB_EXCLUDE_AX25=1
  -D RADIOLIB_EXCLUDE_HELLSCHREIBER=1
  -D RADIOLIB_EXCLUDE_MORSE=1
  -D RADIOLIB_EXCLUDE_APRS=1
  -D RADIOLIB_EXCLUDE_BELL=1
  -D RADIOLIB_EXCLUDE_RTTY=1
  -D RADIOLIB_EXCLUDE_SSTV=1
; The fetched MeshCore is not built as a library (lib_ignore below): its library build compiles files that
; need a board variant's target.h, and its Ed25519 sources sit in a lib/ folder it does not look into. The
; files a chat node needs are compiled from the fetched copy (build_src_filter below), found through these paths.
  -I $PROJECT_LIBDEPS_DIR/$PIOENV/MeshCore/src
  -I $PROJECT_LIBDEPS_DIR/$PIOENV/MeshCore/lib/ed25519
build_unflags = -std=gnu++11
; MeshCore is fetched by lib_deps but compiled by build_src_filter (see the build flags above).
lib_ignore = MeshCore
lib_deps =
  lewisxhe/SensorLib @ 0.5.0
; MeshCore at one commit (companion-v1.18.0, 2026-10-15) and, of what its library.json asks for, the two
; libraries a chat node uses, each at the exact version that was read (MeshCore asks for ranges; a later
; release could change what is built without anybody here reading its licence). The clock, sensor and
; telemetry libraries it also lists (RTClib, Melopero RV3028, CayenneLPP) are not used by this adapter.
; Only the `device` environment fetches them (decision D-59, THIRD_PARTY.md).
  https://github.com/meshcore-dev/MeshCore.git#81dbae592ffad40b4212bc0b37e82b38da08f4bc
  jgromes/RadioLib @ 7.8.1
  rweather/Crypto @ 0.4.0
  SD
  FS
  SPI
  WiFi
  Wire
build_src_filter =
  -<*>
  +<app/>
  +<board/>
  +<boot/>
  +<config/>
  +<drivers/>
  +<i18n/>
  +<ui/>
  +<web/>
  +<../device/main.cpp>
  +<../device/MeshCoreRadio.cpp>
  +<../.pio/libdeps/device/MeshCore/lib/ed25519/*.c>
  +<../.pio/libdeps/device/MeshCore/src/Dispatcher.cpp>
  +<../.pio/libdeps/device/MeshCore/src/Identity.cpp>
  +<../.pio/libdeps/device/MeshCore/src/Mesh.cpp>
  +<../.pio/libdeps/device/MeshCore/src/Packet.cpp>
  +<../.pio/libdeps/device/MeshCore/src/Utils.cpp>
  +<../.pio/libdeps/device/MeshCore/src/helpers/AdvertDataHelpers.cpp>
  +<../.pio/libdeps/device/MeshCore/src/helpers/BaseChatMesh.cpp>
  +<../.pio/libdeps/device/MeshCore/src/helpers/StaticPoolPacketManager.cpp>
  +<../.pio/libdeps/device/MeshCore/src/helpers/TxtDataHelpers.cpp>
  +<../.pio/libdeps/device/MeshCore/src/helpers/radiolib/RadioLibWrappers.cpp>
