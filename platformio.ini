; PhonePlus — host tests of the pure C++ code.
;   pio test -e native
; Device and simulator environments are added together with the code that needs them.
; -I sim: the simulated panel and the PNG writer are header-only and tested with the rest.

[platformio]
default_envs = native

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_flags =
  -std=c++17
  -Wall -Wextra -Werror
  -I src
  -I testing
  -I sim
test_ignore =
  test_check_i18n
  test_schema_gen
  test_web_page
  test_demo_page

[env:native-asan]
platform = native
test_framework = unity
test_build_src = yes
build_flags =
  -std=c++17
  -Wall -Wextra -Werror
  -I src
  -I testing
  -I sim
  -fsanitize=address,undefined
  -fno-omit-frame-pointer
test_ignore =
  test_check_i18n
  test_schema_gen
  test_web_page
  test_demo_page

; The simulator: the application on the fakes, a console, no window. Needs nothing but a compiler.
;   pio run -e sim && .pio/build/sim/program --script sim/scripts/smoke.txt
[env:sim]
platform = native
build_flags =
  -std=c++17
  -Wall -Wextra -Werror
  -I src
  -I testing
  -I sim
  -pthread
build_src_filter = +<*> +<../sim/main.cpp>

; The same with a window (SDL2: brew install sdl2).
[env:sim-sdl]
extends = env:sim
build_flags =
  ${env:sim.build_flags}
  -DPHONEPLUS_SIM_SDL=1
  !sdl2-config --cflags --libs
