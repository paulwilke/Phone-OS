; PhonePlus — host tests of the pure C++ code.
;   pio test -e native
; Device and simulator environments are added together with the code that needs them.

[platformio]
default_envs = native

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_flags =
  -std=c++17
  -Wall -Wextra -Werror
  -I src
  -I testing
