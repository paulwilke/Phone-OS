; Phone OS — host tests of the pure C++ code.
;   pio test -e native
; Device and simulator environments are added together with the code that needs them.
; -I sim: the simulated panel and the PNG writer are header-only and tested with the rest.

[platformio]
default_envs = native

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_flags =
  -std=c++17
  -Wall -Wextra -Werror
  -I src
  -I testing
  -I sim
test_ignore =
  test_check_i18n
  test_schema_gen
  test_gen_apn
  test_web_page
  test_demo_page
  test_check_layers
  test_check_docs
  test_device_tools
  test_translating
  test_privacy_check
  test_make_demo
  test_make_site
  test_site_page

[env:native-asan]
platform = native
test_framework = unity
test_build_src = yes
build_flags =
  -std=c++17
  -Wall -Wextra -Werror
  -I src
  -I testing
  -I sim
  -fsanitize=address,undefined
  -fno-omit-frame-pointer
test_ignore =
  test_check_i18n
  test_schema_gen
  test_gen_apn
  test_web_page
  test_demo_page
  test_check_layers
  test_check_docs
  test_device_tools
  test_translating
  test_privacy_check
  test_make_demo
  test_make_site
  test_site_page

; The simulator: the application on the fakes, a console, no window. Needs nothing but a compiler.
;   pio run -e sim && .pio/build/sim/program --script sim/scripts/smoke.txt
[env:sim]
platform = native
build_flags =
  -std=c++17
  -Wall -Wextra -Werror
  -I src
  -I testing
  -I sim
  -pthread
  -O2
build_src_filter = +<*> +<../sim/main.cpp>

; The same with a window (SDL2: brew install sdl2).
[env:sim-sdl]
extends = env:sim
build_flags =
  ${env:sim.build_flags}
  -DPHONE_OS_SIM_SDL=1
  !sdl2-config --cflags --libs

; The firmware for the T-Deck Pro MAX (docs/hardware/device.md). CI builds it; flashing is the owner's decision.
;   pio run -e device
; Platform code lives in device/, the testable logic in src/. -I src: device/ includes the layers of src/.
[env:device]
platform = platformio/espressif32@6.11.0
framework = arduino
; PlatformIO's own ESP32-S3 board, set to what the T-Deck Pro MAX has: 16 MB QIO flash at 80 MHz and
; 8 MB QSPI PSRAM (BOARD_HAS_PSRAM below), USB serial on the processor's own port.
board = esp32-s3-devkitc-1
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.arduino.memory_type = qio_qspi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_upload.speed = 921600
; The parents' page is data of the firmware (device/FlashAssets.h); web/index.html is generated by
; scripts/gen_web.py and CI checks that it is current.
board_build.embed_txtfiles = web/index.html
monitor_speed = 115200
build_flags =
  -std=gnu++17
  -Wall -Wextra
  -I src
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D BOARD_HAS_PSRAM=1
build_unflags = -std=gnu++11
lib_deps =
  lewisxhe/SensorLib @ 0.5.0
  SD
  FS
  SPI
  WiFi
  Wire
build_src_filter =
  -<*>
  +<app/>
  +<board/>
  +<boot/>
  +<config/>
  +<drivers/>
  +<i18n/>
  +<ui/>
  +<web/>
  +<../device/main.cpp>
