site.does.title          = "Ce que fait le téléphone de l'enfant, et ce qu'il refuse"
site.does.intro          = "Configuré en téléphone d'enfant, l'appareil fait peu de choses, chacune jusqu'au bout : il n'appelle que le carnet d'adresses, laisse tomber sans un bruit tout ce qui vient d'inconnus et reste silencieux pendant l'école. Les parents le règlent depuis leur propre téléphone, dans un navigateur."
site.does.phone.title    = "Téléphone"
site.does.phone.text     = "L'enfant appelle les personnes que les parents ont inscrites, et personne d'autre ne peut appeler ni écrire. L'appel ou le texto d'un inconnu laisse une ligne dans le journal : pas de sonnerie, pas de vibration, pas d'avis."
site.does.phone.alt      = "Un appel de Parent One arrive"
site.does.text.title     = "Textos"
site.does.text.text      = "Six messages tout prêts, affichés dans la langue de l'enfant et envoyés dans celle des parents. Le texte libre et les nouveaux numéros seulement si les parents les activent."
site.does.text.alt       = "Choisir un message tout prêt"
site.does.sos.title      = "SOS"
site.does.sos.text       = "Un bouton. Un compte à rebours de 40 secondes, puis un texto avec la position part vers les parents ; un appel pendant le compte à rebours ne l'annule pas."
site.does.sos.alt        = "La page SOS et son compte à rebours"
site.does.school.title   = "Heures de classe"
site.does.school.text    = "Pendant les plages que les parents fixent, le téléphone reste fermé et chaque appel est refusé sans sonner. Les parents voient un appel manqué et peuvent rappeler."
site.does.school.alt     = "L'écran d'accueil pendant les heures de classe"
site.does.parents.title  = "La page des parents"
site.does.parents.text   = "Les contacts, les heures de classe, les réglages et le journal, depuis un téléphone, dans un navigateur : par le point d'accès propre de l'appareil ou par le câble USB. La page est servie par l'appareil lui-même."
site.does.parents.alt    = "La page Wi-Fi avec le point d'accès activé"
site.does.battery.title  = "La batterie"
site.does.battery.text   = "L'appareil s'éteint lui-même à 3300 mV et le dit. Une mesure toutes les dix minutes va dans un journal d'énergie ; c'est ainsi que les erreurs de la jauge ont été trouvées."
site.does.battery.alt    = "Batterie presque vide"

site.get.title        = "Comment le mettre sur un appareil"
site.get.intro        = "Phone OS n'est pas vendu avec un téléphone. Vous achetez l'appareil, téléchargez le code et l'installez vous-même par un câble USB. Quatre étapes, pas de soudure."
site.get.device.title = "1. L'appareil"
site.get.device.text  = "Un LilyGO T-Deck Pro MAX : un appareil portable fini, dans son boîtier, avec un ESP32-S3, un écran e-ink, un modem 4G, un GPS, un clavier et une batterie. Vendu tout fait par son fabricant et par des boutiques d'électronique ; une fois flashé, c'est un téléphone, pas un kit. C'est jusqu'ici le seul appareil sur lequel Phone OS tourne. Ajoutez une carte SIM et une carte microSD."
site.get.device.link  = "L'appareil chez LilyGO"
site.get.code.title   = "2. Le code"
site.get.code.text    = "Téléchargez le dépôt depuis GitHub et installez PlatformIO Core, un outil gratuit en ligne de commande. C'est toute la chaîne d'outils."
site.get.card.title   = "3. La carte mémoire"
site.get.card.text    = "Formatez la carte microSD en FAT32, copiez les trois fichiers d'exemple de config/examples/ dans un dossier /config/ et inscrivez-y vos contacts et vos réglages : du texte simple, une ligne par entrée."
site.get.flash.title  = "4. Installer"
site.get.flash.text   = "Branchez l'appareil en USB et lancez une commande. Environ une minute plus tard, l'appareil démarre avec votre carte."
site.get.bands        = "Le T-Deck Pro MAX ne fonctionne pas sur tous les réseaux mobiles. Son modem 4G, un SIMCom A7682E, ne prend en charge que les bandes LTE B1, B3, B5, B7, B8 et B20, ainsi que le GSM. Si votre réseau utilise une autre bande, l'appareil peut ne trouver aucun réseau. La cause est alors la bande de votre pays, et non un appareil défectueux : les bandes sont celles du modem, et non celles du logiciel, et elles concernent les États-Unis et d'autres régions aux bandes différentes. LilyGO a annoncé qu'il vendra bientôt la variante mondiale « G » du T-Deck Pro, pour ces réseaux. D'ici là, vérifiez les bandes de votre réseau avant d'acheter."
site.get.note         = "Phone OS n'a aucun lien avec LilyGO ni avec une boutique ; le T-Deck Pro MAX est l'appareil sur lequel le firmware a été construit et testé. Un autre matériel demande son propre code de plateforme sous les capacités, et rien ne change au-dessus."
site.get.checklist    = "La liste de contrôle du premier démarrage"

site.verified.title         = "Ce qui est testé, et ce qui est vérifié"
site.verified.intro         = "Le projet n'affirme que ce qui a été vérifié. Chaque changement porte l'une de trois marques, et le journal des modifications dit laquelle."
site.verified.compiled.title = "Compilé"
site.verified.compiled.text  = "Il compile pour l'ESP32-S3. C'est tout ce que cela dit."
site.verified.host.title     = "Testé sur l'ordinateur"
site.verified.host.text      = "La logique tourne sur un portable contre des imitations de chaque puce, et le simulateur joue des scénarios entiers à travers les vrais écrans."
site.verified.device.title   = "Confirmé sur l'appareil"
site.verified.device.text    = "Vu sur le vrai téléphone par le propriétaire, avec une date dans le journal des décisions. Ce que l'appareil a appris est écrit, et une leçon qui a changé le code reçoit sa propre décision."
