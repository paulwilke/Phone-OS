site.hero.eyebrow  = "Open source · ESP32-S3 · MIT"
site.hero.title    = "Un système d'exploitation pour téléphone. 100 % open source."
site.hero.lead     = "Phone OS est un système d'exploitation complet pour un téléphone, ouvert de la première ligne à la dernière : le firmware, la page des parents, le simulateur et chaque document sont sous licence MIT. Il tourne sur un ESP32-S3 avec un écran e-ink, un modem 4G et un GPS. Ce que fait un appareil dépend de sa configuration : le premier construit avec lui est un téléphone d'urgence pour un enfant, qui appelle la famille, lit et écrit des textos, envoie sa position d'une seule touche, et rien d'autre."
