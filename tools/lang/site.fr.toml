site.built.title         = "Une application, deux plateformes"
site.built.intro         = "Le firmware et le simulateur exécutent le même assemblage du même code. Ce qui diffère se trouve sous les interfaces des capacités : de vraies puces sur l'appareil, des imitations scriptées sur le portable. C'est pourquoi les images de cette page sont celles de l'appareil."
