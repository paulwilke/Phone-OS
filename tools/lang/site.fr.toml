site.does.title          = "Ce que fait le téléphone de l'enfant, et ce qu'il refuse"
site.does.intro          = "Configuré comme téléphone d'enfant, l'appareil fait peu de choses, chacune jusqu'au bout : il ne compose que le carnet de contacts, écarte sans un bruit tout ce qui vient d'inconnus et se tait pendant les heures de classe. Les parents le règlent depuis leur propre téléphone, dans un navigateur."
site.does.phone.title    = "Téléphone"
site.does.phone.text     = "L'enfant appelle les personnes que les parents ont inscrites, et personne d'autre ne peut appeler ni écrire. L'appel ou le texto d'un inconnu laisse une ligne dans le journal : pas de sonnerie, pas de vibration, pas d'avis."
site.does.phone.alt      = "Un appel de Parent One arrive"
site.does.text.title     = "Textos"
site.does.text.text      = "Six messages tout prêts, affichés dans la langue de l'enfant et envoyés dans celle des parents. Le texte libre et les nouveaux numéros seulement si les parents les activent."
site.does.text.alt       = "Choisir un message tout prêt"
site.does.sos.title      = "SOS"
site.does.sos.text       = "Un bouton. Un compte à rebours de 40 secondes, puis un texto avec la position part vers les parents ; un appel pendant le compte à rebours ne l'annule pas."
site.does.sos.alt        = "La page SOS et son compte à rebours"
site.does.school.title   = "Heures de classe"
site.does.school.text    = "Pendant les plages que les parents fixent, le téléphone reste fermé et chaque appel est refusé sans sonner. Les parents voient un appel manqué et peuvent rappeler."
site.does.school.alt     = "L'écran d'accueil pendant les heures de classe"
site.does.parents.title  = "La page des parents"
site.does.parents.text   = "Les contacts, les heures de classe, les réglages et le journal, depuis un téléphone, dans un navigateur : par le point d'accès propre de l'appareil ou par le câble USB. La page est servie par l'appareil lui-même."
site.does.parents.alt    = "La page Wi-Fi avec le point d'accès activé"
site.does.battery.title  = "La batterie"
site.does.battery.text   = "L'appareil s'éteint de lui-même à 3300 mV et le dit ; toutes les dix minutes, une mesure va dans un journal d'énergie, et c'est ainsi qu'on a trouvé les erreurs de la jauge elle-même."
site.does.battery.alt    = "Batterie presque vide"

site.get.title        = "Comment le mettre sur un appareil"
site.get.intro        = "Phone OS n'est pas vendu avec un téléphone. Vous achetez la carte, téléchargez le code et l'installez vous-même par un câble USB : quatre étapes, pas de soudure, et une liste de contrôle pour le premier démarrage."
site.get.device.title = "1. La carte"
site.get.device.text  = "Une LilyGO T-Deck Pro MAX : un ESP32-S3 avec un écran e-ink, un modem 4G et un récepteur GPS, vendue toute faite par son fabricant et par des boutiques d'électronique. C'est jusqu'ici la seule carte sur laquelle le firmware tourne. Il faut aussi une carte SIM et une carte microSD."
site.get.code.title   = "2. Le code"
site.get.code.text    = "Téléchargez le dépôt depuis GitHub et installez PlatformIO Core, un outil gratuit en ligne de commande. C'est toute la chaîne d'outils."
site.get.card.title   = "3. La carte mémoire"
site.get.card.text    = "Formatez la carte microSD en FAT32, copiez les trois fichiers d'exemple de config/examples/ dans un dossier /config/ et inscrivez-y vos contacts et vos réglages : des fichiers texte simples, une ligne par entrée."
site.get.flash.title  = "4. Installer"
site.get.flash.text   = "Branchez l'appareil en USB et lancez une commande. Cela prend environ une minute ; l'appareil démarre ensuite avec votre carte."
site.get.note         = "Phone OS n'a aucun lien avec LilyGO ni avec une boutique : la T-Deck Pro MAX est simplement la carte sur laquelle le firmware a été construit et testé jusqu'ici. Une autre carte demande son propre code de plateforme sous les capacités ; rien ne change au-dessus. Ce qui n'a pas encore été vu sur l'appareil est dit tel quel, dans le journal des décisions et dans la liste de contrôle."
site.get.checklist    = "La liste de contrôle du premier démarrage"

site.verified.title         = "Trois mots, tenus à part"
site.verified.intro         = "Une erreur coûte plus cher dans un téléphone d'urgence que dans la plupart des logiciels ; le projet ne dit donc jamais \"fonctionne\" quand il veut dire \"compile\". Chaque changement porte l'un de trois mots, et le journal des modifications dit lequel il a atteint."
site.verified.compiled.title = "Compilé"
site.verified.compiled.text  = "Le firmware se construit dans la CI pour l'ESP32-S3. On n'en conclut rien de plus."
site.verified.host.title     = "Testé sur l'ordinateur"
site.verified.host.text      = "La logique tourne sur un portable face à des imitations scriptées de chaque puce, et le simulateur joue des scénarios entiers à travers les vraies pages, touche après touche."
site.verified.device.title   = "Confirmé sur l'appareil"
site.verified.device.text    = "Vu sur le vrai matériel par le propriétaire du projet, avec une date. Ce que l'appareil a appris va dans un fichier de leçons, et une leçon qui a changé le code reçoit une décision consignée."
