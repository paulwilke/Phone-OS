site.built.drivers.knows = "die Fähigkeiten"
site.built.device.holds  = "den Plattformcode der Firmware: die Arduino- und ESP32-Seite der Nahtstellen"
site.built.sim.holds     = "den Simulator und die Nachbildungen jeder Fähigkeit"
site.built.rules         = "Ein Skript prüft die Regeln bei jedem Commit; eine Schicht, die an ihrem Nachbarn vorbeigreift, lässt den Build scheitern."

site.docs.title             = "Weiterlesen"
site.docs.intro             = "Jedes Dokument ist aus dem Code geschrieben, den es beschreibt, und jede Entscheidung ist festgehalten: wer sie getroffen hat und warum. Außer dem Benutzerhandbuch sind die Dokumente englisch."
