site.does.title          = "Was das Kindertelefon tut und was es verweigert"
site.does.intro          = "Als Kindertelefon eingerichtet, tut das Gerät wenige Dinge, jedes ganz: Es ruft nur das Telefonbuch an, lässt alles von Fremden lautlos fallen und bleibt in der Schule still. Die Eltern richten es von ihrem eigenen Telefon aus ein, im Browser."
site.does.phone.title    = "Telefon"
site.does.phone.text     = "Das Kind ruft an, wen die Eltern eingetragen haben, und sonst kann niemand anrufen oder schreiben. Ein Anruf oder ein Text von einem Fremden hinterlässt eine Zeile im Protokoll: kein Klingeln, keine Vibration, kein Hinweis."
site.does.phone.alt      = "Ein Anruf von Parent One kommt"
site.does.text.title     = "Text"
site.does.text.text      = "Sechs fertige Nachrichten, angezeigt in der Sprache des Kindes und gesendet in der Sprache der Eltern. Freitext und neue Nummern nur, wenn die Eltern sie einschalten."
site.does.text.alt       = "Eine fertige Nachricht aussuchen"
site.does.sos.title      = "SOS"
site.does.sos.text       = "Ein Knopf. Die Seite zählt 40 Sekunden herunter, dann geht ein Text mit der Position an die Eltern; ein Anruf während des Herunterzählens bricht ihn nicht ab."
site.does.sos.alt        = "Die SOS-Seite beim Herunterzählen"
site.does.school.title   = "Schulzeit"
site.does.school.text    = "In den Zeitfenstern, die die Eltern festlegen, bleibt das Telefon zu, und jeder Anruf wird ohne Klingeln abgewiesen. Die Eltern sehen einen verpassten Anruf und können zurückrufen."
site.does.school.alt     = "Der Startbildschirm in der Schulzeit"
site.does.parents.title  = "Die Elternseite"
site.does.parents.text   = "Kontakte, Schulzeit, Einstellungen und das Protokoll, vom Telefon aus im Browser: über den eigenen Zugangspunkt des Geräts oder über das USB-Kabel. Das Gerät stellt die Seite selbst bereit."
site.does.parents.alt    = "Die WLAN-Seite mit eingeschaltetem Zugangspunkt"
site.does.battery.title  = "Der Akku"
site.does.battery.text   = "Das Gerät schaltet sich bei 3300 mV selbst ab und sagt das. Alle zehn Minuten geht ein Messwert in ein Energieprotokoll; damit wurden die Fehler der Ladestandsanzeige gefunden."
site.does.battery.alt    = "Akku fast leer"

site.get.title        = "Wie es auf ein Gerät kommt"
site.get.intro        = "Phone OS wird nicht mit einem Telefon verkauft. Du kaufst das Gerät, lädst den Code herunter und spielst ihn selbst über ein USB-Kabel auf. Vier Schritte, kein Löten."
site.get.device.title = "1. Das Gerät"
site.get.device.text  = "Ein LilyGO T-Deck Pro MAX: ein fertiges Handgerät im Gehäuse, mit ESP32-S3, E-Ink-Bildschirm, 4G-Modem, GPS, Tastatur und Akku. Fertig zu kaufen beim Hersteller und in Elektronikläden; nach dem Aufspielen ist es ein Telefon, kein Bausatz. Es ist bisher das eine Gerät, auf dem Phone OS läuft. Dazu kommen eine SIM-Karte und eine microSD-Karte."
site.get.device.link  = "Das Gerät bei LilyGO"
site.get.code.title   = "2. Der Code"
site.get.code.text    = "Lade das Repository von GitHub herunter und installiere PlatformIO Core, ein kostenloses Kommandozeilenwerkzeug. Das ist die ganze Werkzeugkette."
site.get.card.title   = "3. Die Karte"
site.get.card.text    = "Formatiere die microSD-Karte als FAT32, kopiere die drei Beispieldateien aus config/examples/ in einen Ordner /config/ darauf und trage deine Kontakte und Einstellungen ein: einfacher Text, eine Zeile pro Eintrag."
site.get.flash.title  = "4. Aufspielen"
site.get.flash.text   = "Schließe das Gerät per USB an und führe einen Befehl aus. Etwa eine Minute später startet das Gerät mit deiner Karte."
site.get.note         = "Phone OS hat keine Verbindung zu LilyGO oder zu einem Laden; das T-Deck Pro MAX ist das Gerät, auf dem die Firmware gebaut und getestet wurde. Andere Hardware braucht eigenen Plattformcode unterhalb der Fähigkeiten, und darüber ändert sich nichts."
site.get.checklist    = "Die Checkliste für den ersten Start"

site.verified.title         = "Was getestet ist, und was geprüft"
site.verified.intro         = "Das Projekt behauptet nur, was geprüft wurde. Jede Änderung trägt eine von drei Marken, und das Änderungsprotokoll sagt welche."
site.verified.compiled.title = "Kompiliert"
site.verified.compiled.text  = "Es baut für den ESP32-S3. Mehr sagt das nicht."
site.verified.host.title     = "Auf dem Rechner getestet"
site.verified.host.text      = "Die Logik läuft auf einem Laptop gegen Nachbildungen jedes Chips, und der Simulator spielt ganze Abläufe durch die echten Bildschirme."
site.verified.device.title   = "Am Gerät bestätigt"
site.verified.device.text    = "Am echten Telefon vom Eigentümer gesehen, mit Datum im Entscheidungsprotokoll. Was das Gerät gelehrt hat, steht geschrieben, und eine Lehre, die den Code geändert hat, bekommt ihre eigene Entscheidung."
site.stats.version  = "aktuelle Version"
site.stats.tests    = "Tests auf dem Rechner"
site.stats.pictures = "Bilder in dieser Vorführung, in drei Sprachen"
site.stats.invented = "echte Namen oder Nummern auf dieser Seite: jedes Beispiel ist erfunden"

site.built.title         = "Eine Anwendung, zwei Plattformen"
site.built.intro         = "Die Firmware und der Simulator führen dieselbe Zusammenstellung desselben Codes aus. Nur was unter den Schnittstellen der Fähigkeiten liegt, unterscheidet sich: echte Chips auf dem Gerät, geskriptete Nachbildungen auf dem Laptop. Darum sind die Bilder auf dieser Seite die Bilder des Geräts."
