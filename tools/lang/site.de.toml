site.hero.eyebrow  = "Open Source · ESP32-S3 · MIT"
site.hero.title    = "Ein Betriebssystem für Telefone. Zu 100 % Open Source."
site.hero.lead     = "Phone OS ist ein vollständiges Betriebssystem für ein Telefon, offen von der ersten bis zur letzten Zeile: die Firmware, die Elternseite, der Simulator und jedes Dokument, alles unter der MIT-Lizenz. Es läuft auf einem fertigen Handgerät mit ESP32-S3, E-Ink-Bildschirm, 4G-Modem und GPS."
site.hero.lead-2   = "Was ein Gerät kann, bestimmt seine Konfiguration. Das erste mit Phone OS gebaute Gerät ist ein Notfalltelefon für ein Kind: Es ruft die Familie an, liest und schreibt Texte, sendet auf Knopfdruck seine Position, und sonst nichts."
