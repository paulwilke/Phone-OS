site.meta.title          = "Phone OS"
site.meta.description    = "Phone OS: ein Betriebssystem für Telefone, zu 100 % Open Source. Es läuft auf dem LilyGO T-Deck Pro MAX, einem fertigen Handgerät; das erste damit gebaute Gerät ist ein Notfalltelefon für ein Kind. Probiere jeden Bildschirm im Browser aus."
site.meta.og-description = "Phone OS: ein Betriebssystem für Telefone, zu 100 % Open Source. Es läuft auf dem LilyGO T-Deck Pro MAX, einem fertigen Handgerät; das erste damit gebaute Gerät ist ein Notfalltelefon für ein Kind. Probiere jeden Bildschirm im Browser aus."

