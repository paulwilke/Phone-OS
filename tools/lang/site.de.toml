site.footer.licence   = "Phone OS steht unter der MIT-Lizenz. Die Liste der Netzbetreiber sind Daten aus dem Android Open Source Project unter Apache-2.0, und die Schriften des Bildschirms sind Adobes Helvetica-Bitmapschriften unter ihrem eigenen Erlaubnisvermerk; beide sind in den Hinweisen zu Software Dritter im Repository aufgeführt."
site.footer.generated = "Der LoRa-Funk ist nicht Teil der aktuellen Version. Nichts auf dieser Seite ist von Hand gezeichnet: Die Bilder erzeugt der Simulator bei jedem Build, und diese Seite wird mit ihnen neu gebaut."
