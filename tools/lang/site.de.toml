site.hero.eyebrow  = "Open Source · LilyGO T-Deck Pro MAX · MIT"
site.hero.title    = "Ein Betriebssystem für Telefone. Zu 100 % Open Source."
site.hero.lead     = "Phone OS ist ein vollständiges Betriebssystem für ein Telefon, offen von der ersten bis zur letzten Zeile: Die Firmware, die Elternseite, der Simulator und jedes Dokument stehen unter der MIT-Lizenz. Es läuft auf dem LilyGO T-Deck Pro MAX (ESP32-S3, E-Ink-Bildschirm, 4G-Modem, GPS). Was ein Gerät kann, bestimmt seine Konfiguration: Das erste, das damit gebaut ist, ist ein Notfalltelefon für ein Kind, das die Familie anruft, Texte liest und schreibt, auf Knopfdruck die Position sendet, und sonst nichts."
