site.does.title          = "What the child's phone does, and what it refuses"
site.does.intro          = "Set up as a child's phone, the device does a few things, each all the way: it calls only the contact book, drops everything from strangers without a sound, and stays quiet during school. The parents set it up from their own phone, in a browser."
site.does.phone.title    = "Phone"
site.does.phone.text     = "The child calls whom the parents listed, and nobody else can call or write. A stranger's call or text leaves one line in the log: no ring, no vibration, no notice."
site.does.phone.alt      = "A call from Parent One comes in"
site.does.text.title     = "Text"
site.does.text.text      = "Six ready-made messages, shown in the child's language and sent in the parents'. Free text and new numbers only when the parents switch them on."
site.does.text.alt       = "Choosing a ready-made message"
site.does.sos.title      = "SOS"
site.does.sos.text       = "One button. A countdown of 40 seconds, then a text with the position goes to the parents; a call during the countdown does not cancel it."
site.does.sos.alt        = "The SOS page with its countdown"
site.does.school.title   = "School time"
site.does.school.text    = "In the windows the parents set, the phone stays shut and every call is turned away without a ring. The parents see a missed call and can call back."
site.does.school.alt     = "The home screen during school time"
site.does.parents.title  = "The parents' page"
site.does.parents.text   = "Contacts, school time, settings and the log, from a phone in a browser: over the device's own access point or over the USB cable. The page is served by the device itself."
site.does.parents.alt    = "The Wi-Fi page with the access point on"
site.does.battery.title  = "The battery"
site.does.battery.text   = "The device switches itself off at 3300 mV and says so. A reading every ten minutes goes to an energy log; that log is how the gauge's own mistakes were found."
site.does.battery.alt    = "Battery nearly empty"

site.get.title        = "How it gets onto a device"
site.get.intro        = "Phone OS is not sold with a phone. You buy the device, download the code and flash it yourself over a USB cable. Four steps, no soldering."
site.get.device.title = "1. The device"
site.get.device.text  = "A LilyGO T-Deck Pro MAX: a finished handheld in its case, with an ESP32-S3, an e-ink display, a 4G modem, GPS, a keyboard and a battery. Sold ready-made by its maker and by electronics shops; after flashing it is a phone, not a kit. It is the one device Phone OS runs on so far. Add a SIM card and a microSD card."
site.get.device.link  = "The device at LilyGO"
site.get.code.title   = "2. The code"
site.get.code.text    = "Download the repository from GitHub and install PlatformIO Core, a free command-line tool. That is the whole toolchain."
site.get.card.title   = "3. The card"
site.get.card.text    = "Format the microSD card as FAT32, copy the three example files from config/examples/ into a folder /config/ on it, and write your contacts and settings into them: plain text, one line per entry."
site.get.flash.title  = "4. Flash"
site.get.flash.text   = "Connect the device by USB and run one command. About a minute later the device starts with your card."
site.get.note         = "Phone OS has no connection with LilyGO or with any shop; the T-Deck Pro MAX is the device the firmware was built and tested on. Other hardware needs its own platform code below the capabilities, and nothing above them changes."
site.get.checklist    = "The checklist for the first start"

site.verified.title         = "What is tested, and what is verified"
site.verified.intro         = "The project claims only what was checked. Every change carries one of three marks, and the changelog says which."
site.verified.compiled.title = "Compiled"
site.verified.compiled.text  = "It builds for the ESP32-S3. That is all this says."
site.verified.host.title     = "Tested on the host"
site.verified.host.text      = "The logic runs on a laptop against fakes of every chip, and the simulator plays whole scenarios through the real screens."
site.verified.device.title   = "Verified on the device"
site.verified.device.text    = "Seen on the real phone by the owner, with a date in the decision log. What the device taught is written down, and a lesson that changed the code gets its own decision."
site.stats.version  = "current version"
site.stats.tests    = "host tests"
site.stats.pictures = "pictures in this demo, in three languages"
site.stats.invented = "real names or numbers on this page: every example is invented"

site.built.title         = "One application, two platforms"
site.built.intro         = "The firmware and the simulator run the same composition of the same code. Only what lies below the capability interfaces differs: real chips on the device, scripted fakes on the laptop. That is why the pictures on this page are the device's pictures."
site.built.layer         = "Layer"
site.built.holds         = "Holds"
site.built.may-know      = "May know"
site.built.hal.holds     = "the capabilities: interfaces named after what the software needs (clock, modem, power, positioning, files)"
site.built.hal.knows     = "nothing"
site.built.app.holds     = "the application (contact book, school time, SOS, messages) and the pages"
site.built.app.knows     = "the capabilities only; never the hardware or a driver"
site.built.drivers.holds = "the modem driver, the receiver parser, the chips of the device"
site.built.drivers.knows = "the capabilities"
site.built.device.holds  = "the firmware's platform code: the Arduino and ESP32 side of the seams"
site.built.sim.holds     = "the simulator and the fakes of every capability"
site.built.rules         = "A script checks the rules on every commit; a layer that reaches past its neighbour fails the build."

