site.hero.eyebrow  = "Open source · LilyGO T-Deck Pro MAX · MIT"
site.hero.title    = "A phone operating system. 100 % open source."
site.hero.lead     = "Phone OS is a complete operating system for a phone, open from the first line to the last: the firmware, the parents' page, the simulator and every document are MIT licensed. It runs on the LilyGO T-Deck Pro MAX (ESP32-S3, e-ink display, 4G modem, GPS). What a device offers is its configuration: the first one built with it is an emergency phone for a child, which calls the family, reads and writes texts, sends the position at the press of a button, and nothing else."
