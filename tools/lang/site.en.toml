site.meta.title          = "Phone OS"
site.meta.description    = "Phone OS: a phone operating system that is 100 % open source. It runs on the LilyGO T-Deck Pro MAX, a ready-made handheld; the first device built with it is an emergency phone for a child. Try every screen in the browser."
site.meta.og-description = "Phone OS: a phone operating system that is 100 % open source. It runs on the LilyGO T-Deck Pro MAX, a ready-made handheld; the first device built with it is an emergency phone for a child. Try every screen in the browser."

