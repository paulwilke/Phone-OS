site.hero.eyebrow  = "Open source · ESP32-S3 · MIT"
site.hero.title    = "A phone operating system. 100 % open source."
site.hero.lead     = "Phone OS is a complete operating system for a phone, open from the first line to the last: the firmware, the parents' web page, the simulator and every document, all under the MIT licence. It runs on a ready-made handheld with an ESP32-S3, an e-ink display, a 4G modem and GPS."
site.hero.lead-2   = "What a device does is its configuration. The first one built with Phone OS is an emergency phone for a child: it calls the family, reads and writes texts, sends its position at the press of a button, and nothing else."
