name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # tomllib, which the catalog check needs, arrived in Python 3.11.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: pip install platformio

      - name: Host tests
        run: pio test -e native

      # A plain Linux runner has no SDL and needs none: the simulator builds and runs headless.
      - name: Simulator build
        run: pio run -e sim

      - name: Simulator scenarios
        run: |
          for scenario in sim/scripts/*.txt; do
            echo "== $scenario"
            .pio/build/sim/program --script "$scenario"
          done

      - name: The translating guide, followed in the simulator
        run: python3 test/test_translating/test_doc.py

      # Compile-only: the firmware is built, never flashed, by CI.
      - name: Firmware build
        run: pio run -e device

      - name: Demo page
        run: node test/test_demo_page/test.mjs

      # Walks the interface, takes the scenes, builds the page, and fails when a picture is missing.
      - name: Click-through demo
        run: python3 scripts/make_demo.py

      - name: Upload the demo
        uses: actions/upload-artifact@v4
        with:
          name: demo
          path: out/demo
          if-no-files-found: error

      - name: Language catalogs
        run: python3 scripts/check_i18n.py

      - name: Catalog keys against the code
        run: python3 scripts/check_i18n.py --usage

      - name: Catalog check tests
        run: python3 test/test_check_i18n/test_check.py

      - name: Behaviour inventory
        run: python3 scripts/check_behaviour.py --complete

      - name: Documentation and code hygiene
        run: python3 scripts/check_docs.py

      - name: Layers
        run: python3 scripts/check_layers.py

      - name: Layer check tests
        run: python3 test/test_check_layers/test_check.py

      - name: Guide structure check tests
        run: python3 test/test_check_docs/test_check.py

      - name: Generated fonts
        run: python3 scripts/make_font.py --check

      - name: Generated configuration files
        run: python3 scripts/gen_config.py --check

      - name: Generator tests
        run: python3 test/test_schema_gen/test_gen.py

      - name: Operator list check and its generator test
        run: |
          python3 scripts/gen_apn_table.py --check
          python3 test/test_gen_apn/test_gen.py

      - name: Generated device assets
        run: python3 scripts/gen_device_assets.py --check

      - name: USB tool tests
        run: python3 test/test_device_tools/test_tools.py

      - name: Generated web page
        run: python3 scripts/gen_web.py --check

      - name: Web page tests
        run: node test/test_web_page/test.mjs

      - name: Privacy
        run: python3 scripts/privacy_check.py

      - name: Privacy check tests
        run: python3 test/test_privacy_check/test_history.py

      - name: The rules the demo's graph is held to
        run: python3 test/test_make_demo/test_graph.py

      - name: The web page's assembly
        run: python3 test/test_make_site/test_site.py

      - name: The web page's words and language selector
        run: node test/test_site_page/test.mjs

  # The host tests again under AddressSanitizer and UndefinedBehaviorSanitizer (about 20 minutes),
  # as a job of its own so that it runs beside the checks above instead of after them.
  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: pip install platformio

      - name: Host tests under sanitizers
        run: pio test -e native-asan
