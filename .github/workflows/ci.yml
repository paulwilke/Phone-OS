name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # tomllib, which the catalog check needs, arrived in Python 3.11.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: pip install platformio

      - name: Host tests
        run: pio test -e native

      # A plain Linux runner has no SDL and needs none: the simulator builds and runs headless.
      - name: Simulator build
        run: pio run -e sim

      - name: Simulator smoke scenario (pictures compared with sim/golden)
        run: .pio/build/sim/program --script sim/scripts/smoke.txt

      - name: Language catalogs
        run: python3 scripts/check_i18n.py

      - name: Catalog keys against the code
        run: python3 scripts/check_i18n.py --usage

      - name: Behaviour inventory
        run: python3 scripts/check_behaviour.py --complete

      - name: Documentation and code hygiene
        run: python3 scripts/check_docs.py

      - name: Layers
        run: python3 scripts/check_layers.py

      - name: Generated fonts
        run: python3 scripts/make_font.py --check

      - name: Generated configuration files
        run: python3 scripts/gen_config.py --check

      - name: Generated web page
        run: python3 scripts/gen_web.py --check

      - name: Web page tests
        run: node test/test_web_page/test.mjs

      - name: Privacy
        run: python3 scripts/privacy_check.py
