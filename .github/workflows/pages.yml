name: pages

# The project's web page (docs/process/site.md): the page in site/ around the click-through demo, which the
# simulator draws on every run. Nothing generated is committed; the page is rebuilt from main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: pip install platformio

      # Headless, as in ci.yml: a plain Linux runner has no SDL and needs none.
      - name: Simulator build
        run: pio run -e sim

      - name: Click-through demo
        run: python3 scripts/make_demo.py

      - name: Assemble the page
        run: python3 scripts/make_site.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
